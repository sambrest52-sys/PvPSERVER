# Core messages (MiniMessage: https://docs.advntr.dev/minimessage/format.html).
# Theme colours are available everywhere as tags, e.g. <primary>text</primary>. Set a message to "" to disable it.
# Lists send multiple lines.

theme:
  primary: "#55C1FF"
  secondary: "#FFFFFF"
  accent: "#FFD166"
  success: "#5CDB95"
  error: "#FF5C5C"
  muted: "#8C8C8C"

prefix: "<primary><bold>PRACTICE</bold></primary> <dark_gray>»</dark_gray> "

general:
  feature-unavailable: "<prefix><error>That feature is not available right now."

command:
  no-permission: "<prefix><error>You don't have permission to do that."
  player-only: "<prefix><error>Only players can use this command."
  usage: "<prefix><gray>Usage: <white><usage>"
  error: "<prefix><error>Something went wrong. Please try again."
  help-header: "<primary><bold>/<command></bold> <gray>commands:"
  help-entry: " <dark_gray>•</dark_gray> <white><usage></white> <gray>- <description>"
  player-not-found: "<prefix><error><player> is not online."
  player-never-joined: "<prefix><error><player> has never joined."
  not-a-number: "<prefix><error>'<value>' is not a number."

profile:
  load-failed: "<error>Your profile could not be loaded. Please reconnect in a moment."

combat:
  pearl-cooldown: "<error>Ender pearl cooldown: <white><seconds>s"
  gapple-cooldown: "<error>Golden apple cooldown: <white><seconds>s"

party:
  created: "<prefix><success>Party created. <gray>Invite players with <white>/party invite <player>"
  already-in-party: "<prefix><error>You are already in a party."
  not-in-party: "<prefix><error>You are not in a party."
  not-leader: "<prefix><error>Only the party leader can do that."
  not-member: "<prefix><error><player> is not in your party."
  already-member: "<prefix><error><player> is already in the party."
  already-invited: "<prefix><error><player> already has a pending invite."
  not-invited: "<prefix><error>You have not been invited to that party."
  full: "<prefix><error>That party is full."
  self: "<prefix><error>You can't do that to yourself."
  not-found: "<prefix><error><player> is not in a party."
  busy: "<prefix><error>You can't do that right now."
  busy-members: "<prefix><error>Some members are still in a match."
  invites-disabled: "<prefix><error><player> is not accepting party invites."
  invited: "<prefix><accent><player></accent> <gray>was invited to the party."
  invite-received: "<prefix><accent><player></accent> <gray>invited you to their party. <accept> <dark_gray>(expires in <seconds>s)"
  invite-accept-button: "<success><bold>[ACCEPT]</bold>"
  invite-accept-hover: "<gray>Click to join the party"
  invite-expired: "<prefix><gray>Your party invite from <white><player></white> expired."
  joined: "<prefix><success><player></success> <gray>joined the party."
  left: "<prefix><accent><player></accent> <gray>left the party."
  left-quit: "<prefix><accent><player></accent> <gray>disconnected and left the party."
  left-self: "<prefix><gray>You left the party."
  kicked: "<prefix><accent><player></accent> <gray>was kicked from the party."
  kicked-self: "<prefix><error>You were kicked from the party."
  new-leader: "<prefix><accent><player></accent> <gray>is now the party leader."
  disbanded: "<prefix><error>The party was disbanded."
  opened: "<prefix><gray>The party is now <success>open</success>. Anyone can <white>/party join</white>."
  closed: "<prefix><gray>The party is now <error>invite only</error>."
  chat: "<primary>[Party]</primary> <white><player></white><dark_gray>:</dark_gray> <gray><message>"
  info:
    - "<primary><bold>Party</bold> <dark_gray>(<size>/<max>, <status>)"
    - " <gray>Leader: <white><leader>"
    - " <gray>Members: <white><members>"

arena:
  invalid-name: "<prefix><error>Arena names may only contain a-z, 0-9, _ and -."
  exists: "<prefix><error>Arena <arena> already exists. Use /arena edit <arena>."
  not-found: "<prefix><error>Arena <arena> does not exist or has no template."
  session-created: "<prefix><success>Editing new arena <arena>.</success> <gray>Build it, select it with the wand (/arena pos1/pos2), set spawns (/arena setspawn a|b) and /arena save."
  session-cancelled: "<prefix><gray>Edit session discarded."
  no-session: "<prefix><error>You are not editing an arena. Use /arena create <name> or /arena edit <name>."
  pasting: "<prefix><gray>Pasting <white><arena></white> into the editor world..."
  editing: "<prefix><success>Now editing <arena>.</success> <gray>Change what you like, then /arena save."
  incomplete: "<prefix><error>Set pos1, pos2, spawn a and spawn b before saving."
  different-worlds: "<prefix><error>Both corners must be in the same world."
  too-large: "<prefix><error>The selection is too large (<volume> blocks)."
  saving: "<prefix><gray>Capturing <white><volume></white> blocks for <white><arena></white>..."
  saved: "<prefix><success>Arena <arena> saved. New matches will use it."
  save-failed: "<prefix><error>Saving failed, see console."
  pos-set: "<prefix><gray>Position <white><pos></white> set to <white><location></white>."
  spawn-set: "<prefix><gray>Spawn <white><spawn></white> set."
  goal-set: "<prefix><gray>Goal <white><goal></white> set."
  value-set: "<prefix><gray>Set <white><key></white> to <white><value></white>."
  hold-item: "<prefix><error>Hold an item first."
  enabled: "<prefix><success>Arena <arena> enabled."
  disabled: "<prefix><gray>Arena <arena> disabled."
  deleted: "<prefix><gray>Arena <arena> deleted."
  not-available: "<prefix><error>No free copy of <arena> right now."
  teleported: "<prefix><gray>Teleported to a copy of <white><arena></white> (returned to the pool in 60s)."
  list-header: "<primary><bold>Arenas</bold> <dark_gray>(<count>)"
  list-entry: " <dark_gray>•</dark_gray> <white><arena></white> <gray>[<tags>] <dark_gray>- <status>"
  info:
    - "<primary><bold>Arena <arena>"
    - " <gray>Tags: <white><tags>"
    - " <gray>Size: <white><size></white> <dark_gray>|</dark_gray> Build limit: <white><build_limit></white> <dark_gray>|</dark_gray> Void Y: <white><void_y>"
    - " <gray>Enabled: <white><enabled></white> <dark_gray>|</dark_gray> Goals: <white><goals></white> <dark_gray>|</dark_gray> Build area: <white><build_area>"
  generating: "<prefix><gray>Generating <white><count></white> built-in arena(s)..."
  generated: "<prefix><success>Regenerated <white><arenas></white>. New matches use the fresh copies."
  unknown-builtin: "<prefix><error><arena> is not a built-in arena. Built-ins: <white><list>"
  build-area-set: "<prefix><gray>Build area corner <white><corner></white> set to <white><location></white>."
  build-area-cleared: "<prefix><gray>Build area cleared: blocks may be placed anywhere below the build limit."
  status: "<prefix><gray>Instances: <white><instances></white> (in use <white><in_use></white>, idle <white><idle></white>) <dark_gray>|</dark_gray> Waiting requests: <white><pending></white> <dark_gray>|</dark_gray> Paste jobs: <white><paste_jobs>"

moderation:
