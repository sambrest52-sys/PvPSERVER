    warn: "<accent><player> was warned by <staff>. <gray>Reason: <white><reason>"
  ban-screen:
    - "<error><bold>You are banned from this server"
    - ""
    - "<gray>Reason: <white><reason>"
    - "<gray>Expires: <white><expires>"
    - ""
    - "<gray>Appeal at <primary>discord.yourserver.net"
  kick-screen:
    - "<error><bold>You were kicked"
    - ""
    - "<gray>Reason: <white><reason>"

