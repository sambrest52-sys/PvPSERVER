  history-header: "<primary><bold>Punishments of <player></bold> <dark_gray>(<count>)"
  history-entry: " <dark_gray><date></dark_gray> <accent><type></accent> <gray><duration> by <white><staff></white>: <white><reason></white> <dark_gray><status>"
  announce:
    ban: "<error><player> was permanently banned by <staff>. <gray>Reason: <white><reason>"
    ban-temp: "<error><player> was banned for <duration> by <staff>. <gray>Reason: <white><reason>"
