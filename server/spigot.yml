config-version: 12
settings:
  debug: false
  bungeecord: false
  save-user-cache-on-stop-only: true
  sample-count: 12
  player-shuffle: 0
  user-cache-size: 1000
  moved-wrongly-threshold: 0.0625
  moved-too-quickly-multiplier: 10.0
  timeout-time: 60
  restart-on-crash: false
  netty-threads: 4
  log-villager-deaths: false
  log-named-deaths: false
  attribute:
    maxAbsorption:
      max: 2048.0
    maxHealth:
      max: 1024.0
    movementSpeed:
      max: 1024.0
    attackDamage:
      max: 2048.0
messages:
  whitelist: You are not whitelisted on this server!
  unknown-command: Unknown command. Type "/help" for help.
  server-full: The server is full!
  outdated-client: Outdated client! Please use {0}
  outdated-server: Outdated server! I'm still on {0}
  restart: Server is restarting
advancements:
  disable-saving: true
  disabled:
  - '*'
players:
  # Practice state lives in PvPCore's database; vanilla player files are not needed.
  disable-saving: true
stats:
  disable-saving: true
  forced-stats: {}
commands:
  tab-complete: 0
  send-namespaced: false
  spam-exclusions:
  - /skill
  silent-commandblock-console: false
  log: true
  replace-commands:
  - setblock
  - summon
  - testforblock
  - tellraw
world-settings:
  default:
    verbose: false
    view-distance: default
    simulation-distance: default
    mob-spawn-range: 4
    item-despawn-rate: 1200
    arrow-despawn-rate: 200
    trident-despawn-rate: 200
    merge-radius:
      item: 3.0
      exp: 4.0
    nerf-spawner-mobs: true
    entity-activation-range:
      animals: 16
      monsters: 24
      raiders: 48
      misc: 8
      water: 8
      villagers: 16
      flying-monsters: 24
      tick-inactive-villagers: false
    entity-tracking-range:
      players: 64
      animals: 32
      monsters: 32
      misc: 32
      display: 64
      other: 32
    ticks-per:
      hopper-transfer: 8
      hopper-check: 8
    hopper-amount: 1
    max-tnt-per-tick: 20
    hanging-tick-frequency: 100
