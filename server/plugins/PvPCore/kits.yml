# Kits. Each kit has display info, availability flags, a knockback profile (kb.yml, or "vanilla"),
# arena tags (arenas.yml) or an explicit arena whitelist/blacklist, rules, armor, items and effects.
#
# This file is versioned: when a plugin update ships a newer config-version, your copy is saved as
# kits.yml.v<old>.bak and replaced. Kits are never merged key by key, so deleting a kit or an item sticks.
# To turn a default kit off, set "enabled: false".
#
# Kit keys:
#   display-name, description (lines shown in menus), order, enabled, ranked, unranked, ffa, editable,
#   knockback, arena-tags, arenas (whitelist, overrides tags), arena-blacklist, icon, rules, armor, offhand,
#   items, fill (fills every empty slot), effects ("type:amplifier:seconds", -1 = whole match)
#
# Item keys: material, amount, name, lore, enchants ["sharpness:3"], unbreakable, potion (base type, e.g.
#            strong_healing), effects (custom potion effects, "speed:1:480" = Speed II for 8:00), color
#            ("#RRGGBB" for leather/potions), glow, tag (golden_head = golden head effects from config.yml).
# "slot" is the default inventory slot (0-8 hotbar, 9-35 inventory). Players can rearrange slots in the
# kit editor; when a kit's items change, saved layouts for it reset to this default automatically.
#
# Rules (defaults in brackets):
#   hunger [true]           food drains
#   regen [VANILLA]         VANILLA | LEGACY (1.8: 1 HP / 4s when food >= 18) | NONE (only potions/apples/soup heal)
#   build [false]           blocks may be placed (below the arena build limit, inside its build area)
#   break-placed-only [true] only blocks placed during the match may be broken
#   breakable []            block types anyone may break during a match (spleef: [SNOW_BLOCK])
#   health-display [true]   hearts under player names
#   hit-delay [20]          max no-damage ticks. 20 = vanilla (a hit every 10 ticks), 0 = no hit delay
#   old-combat [false]      1.8 style: no attack cooldown, no sweep attacks
#   fall-damage [true], pearl-cooldown [15], gapple-cooldown [0], potion-velocity [1.0]
#   no-damage [false]       hits register (knockback/boxing) but deal no damage
#   sumo [false]            touching water / falling below the arena loses the round
#   boxing [false] / boxing-hits [100]  first to N hits wins
#   bridge [false] / bridge-goals [3]   score by jumping into the enemy goal; deaths respawn you at your base
#   arrow-regen [0]         seconds until a shot arrow is given back (arrows cannot be picked up)
#   soup [false] / soup-heal [7.0]      right-click stew to heal instantly (no bowl left)
#   rounds [1]              default rounds to win (duel requests can override)
#   max-duration [900]      seconds until the match ends in a draw (0 = unlimited)
#   drop-items [false]      allow dropping items (bottles/bowls are always removed)

